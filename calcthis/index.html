<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>calcThis</title>

<link rel="icon" type="image/png" href="favicon.png">

<meta property="og:title" content="calcThis">
<meta property="og:description" content="Mental Math Game.">
<meta property="og:type" content="website">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b1020;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px 20px 80px;
}

.back{
    color:#94a3b8;
    text-decoration:none;
    font-size:.95rem;
}

.hero{
    text-align:center;
    padding:70px 0;
}

.logo{
    width:120px;
    height:120px;
    border-radius:28px;
    object-fit:cover;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

h1{
    margin-top:28px;
    font-size:3.4rem;
    letter-spacing:1px;
}

.subtitle{
    margin-top:14px;
    color:#94a3b8;
    font-size:1.1rem;
}

.btn{
    display:inline-block;
    margin-top:32px;

    background:white;
    color:#0b1020;

    text-decoration:none;
    font-weight:700;

    padding:14px 28px;

    border-radius:16px;

    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:40px;
}

.gallery img{
    width:100%;
    border-radius:24px;

    border:1px solid rgba(255,255,255,.08);

    transition:.2s;
}

.gallery img:hover{
    transform:translateY(-4px);
}

.values{
    margin-top:80px;
    text-align:center;
}

.values p{
    color:#cbd5e1;
    font-size:1.05rem;
    line-height:2;
}

footer{
    text-align:center;
    margin-top:100px;
    color:#64748b;
}

@media(max-width:700px){

    h1{
        font-size:2.5rem;
    }

    .gallery{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

<a class="back" href="/">
← aroMathiz
</a>

<section class="hero">

<img
    class="logo"
    src="assets/calcthis.png"
    alt="calcThis"
>

<h1>calcThis</h1>

<div class="subtitle">
    Mental Math Game.
</div>

<a
    class="btn"
    href="https://play.google.com/store/apps/details?id=com.aromathiz.app">
    Google Play
</a>

</section>

<section class="gallery">

<img src="img/home_1.png" alt="">
<img src="img/sequence_2.png" alt="">
<img src="img/duel_1.png" alt="">

</section>

<section class="values">

<p>
Daily challenge.<br>
Challenge friends.<br>
Beat your score.
</p>

</section>

<footer>
© 2026 aroMathiz
</footer>

</div>

</body>
</html>
